[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-history"
version = "0.1.1"
description = "Export, audit and search Devin Desktop session history — Obsidian-ready markdown, JSON and SQLite-aware."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Icaro0310" }]
dependencies = [
  "devin-internals-spec>=0.3.1,<0.4.0",
  "devin-redact>=0.2.0,<0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mcp>=1.2"]
mcp = ["mcp>=1.2"]

[project.scripts]
devin-history = "devin_history.cli:main"
devin-history-mcp = "devin_history.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
