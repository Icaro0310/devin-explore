[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-search"
version = "0.1.1"
description = "Full-text search across all Devin sessions — find that command, that error, that decision."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Icaro0310" }]
dependencies = [
  "devin-internals-spec>=0.3.0,<0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devin-search = "devin_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
