[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-pm"
version = "0.1.0"
description = "Project-manager powerup: turn session history into milestones, status reports and task tracking per repo."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Icaro0310" }]
dependencies = [
  "devin-internals-spec>=0.3.0,<0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mcp>=1.2"]
mcp = ["mcp>=1.2"]

[project.scripts]
devin-pm = "devin_pm.cli:main"
devin-pm-mcp = "devin_pm.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
