[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-graph"
version = "0.1.0"
description = "Knowledge graph over Devin sessions — projects, files, tools and decisions as queryable nodes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Icaro0310" }]
dependencies = [
  "devin-internals-spec>=0.3.0,<0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mcp>=1.2"]
mcp = ["mcp>=1.2"]

[project.scripts]
devin-graph = "devin_graph.cli:main"
devin-graph-mcp = "devin_graph.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
