name: doctor-action (satellite smoke)

# End-to-end proof for the devin-doctor-action satellite (D-2026-10-10d
# rollout): the Action gates the runner's Devin environment. Unlike the
# redact smoke this exercises the failure paths per run — "not
# installed" and "unhealthy" must produce distinct failures.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Prepare environment fixtures
        run: |
          pip install "devin-internals-spec>=0.3,<0.4"
          python - <<'PY'
          from pathlib import Path
          from devin_internals.fixtures import create_devin_data_dir

          # healthy: real schema v17 store generated by the fixtures lib
          ok = Path(".smoke-healthy")
          create_devin_data_dir(ok)
          (ok / "credentials.toml").write_text(
              '[auth]\ntoken = "smoke-token"\n', encoding="utf-8")

          # broken: a sessions.db that is not sqlite at all
          broken = Path(".smoke-broken/cli")
          broken.mkdir(parents=True)
          (broken / "sessions.db").write_text("this is not sqlite")
          PY

      - name: missing install → expect NOT INSTALLED failure
        id: notinstalled
        uses: Icaro0310/devin-doctor-action@4a8d654164b74045311622685f49d8445815f5c0 # v1
        continue-on-error: true
        with:
          data-dir: /tmp/definitely-no-devin-here

      - name: assert not-installed path fired
        run: |
          test "${{ steps.notinstalled.outcome }}" = "failure"
          test "${{ steps.notinstalled.outputs.not_installed }}" = "true"
          echo "not-installed produced a distinct failure (precondition)"

      - name: corrupted store → expect UNHEALTHY failure
        id: unhealthy
        uses: Icaro0310/devin-doctor-action@4a8d654164b74045311622685f49d8445815f5c0 # v1
        continue-on-error: true
        with:
          data-dir: ${{ github.workspace }}/.smoke-broken

      - name: assert unhealthy path fired
        run: |
          test "${{ steps.unhealthy.outcome }}" = "failure"
          test "${{ steps.unhealthy.outputs.not_installed }}" = "false"
          test "${{ steps.unhealthy.outputs.overall }}" = "FAIL"
          echo "unhealthy produced a distinct failure (real gate signal)"

      - name: healthy store → expect pass
        id: healthy
        uses: Icaro0310/devin-doctor-action@4a8d654164b74045311622685f49d8445815f5c0 # v1
        with:
          data-dir: ${{ github.workspace }}/.smoke-healthy

      - name: assert healthy path passed
        run: |
          test "${{ steps.healthy.outcome }}" = "success"
          echo "healthy store passed"
