name: release

# Per-package GitHub releases: a tag `<pkg>-vX.Y.Z` builds, signs and
# publishes a release for packages/<pkg> only. PyPI publishing is a
# separate workflow (publish-<pkg>.yml) triggered by the same tag.

on:
  push:
    tags:
      - "doctor-v*"
      - "history-v*"
      - "search-v*"
      - "graph-v*"
      - "pm-v*"
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        type: choice
        options:
          - doctor
          - graph
          - history
          - pm
          - search

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.pkg.outputs.dir }}
      vsix-dir: ${{ steps.vsix.outputs.dir }}
    steps:
      - id: pkg
        env:
          PKG: ${{ inputs.package || '' }}
        run: |
          pkg="${PKG:-${GITHUB_REF_NAME%%-v*}}"
          echo "dir=packages/$pkg" >> "$GITHUB_OUTPUT"
      # Only doctor and search ship a VS Code adapter today — the
      # reusable fan-out skips the leg when this resolves empty.
      - id: vsix
        env:
          PKG: ${{ inputs.package || '' }}
        run: |
          pkg="${PKG:-${GITHUB_REF_NAME%%-v*}}"
          case "$pkg" in
            doctor|search) echo "dir=packages/$pkg/adapters/vscode" >> "$GITHUB_OUTPUT" ;;
            *) echo "dir=" >> "$GITHUB_OUTPUT" ;;
          esac

  release:
    # GitHub release creation stays tag-push-only — a dispatch (even
    # against an existing tag ref) proves nothing here.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve package dir from tag
        run: echo "PKG_DIR=packages/${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          python -m pip install -e "${PKG_DIR}[dev]" build
          python -m pytest -q "$PKG_DIR"
          python -m build "$PKG_DIR" --outdir "$PKG_DIR/dist"

      - name: Generate SBOM
        run: pipx run --spec cyclonedx-bom cyclonedx-py environment
          "$(which python)" --pyproject "$PKG_DIR/pyproject.toml" --mc-type library
          -o sbom.cdx.json

      - name: Sign artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GPG_PRIVATE_KEY not configured; skipping signing"
            exit 0
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(printf '%s' "$GPG_PRIVATE_KEY" | \
            gpg --batch --show-keys --with-colons | \
            awk -F: '/^fpr/{print $10; exit}')
          for f in "$PKG_DIR"/dist/* sbom.cdx.json; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --local-user "$KEYID" --armor --detach-sign "$f"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Idempotent: a rerun after a partial failure (e.g. attach-vsix
          # died after this job created the release) uploads over the
          # existing release instead of dying on `gh release create`.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PKG_DIR"/dist/* sbom.cdx.json* --clobber
          else
            gh release create "$RELEASE_TAG" "$PKG_DIR"/dist/* sbom.cdx.json* --verify-tag --generate-notes
          fi

  # Channel fan-out for the resolved package: wheel gate → PyPI (skips
  # the upload cross-repo — the inline pypi-publish.yml owns PyPI via
  # its job_workflow_ref binding), .vsix artifact for the portal, docker
  # when an image is named. Idempotent: re-run without a version bump
  # is a no-op on every leg.
  fanout:
    # Same gate as the dedicated callers (release-qa-pack/devkit/bridge/
    # memory): publish legs only ever run on a real tag push after the
    # GitHub release succeeded — a workflow_dispatch must not publish to
    # the registries, and a failed release must not strand a published
    # extension (the 0.2.0 incident: GPG sign died, fanout still shipped).
    needs: [resolve, release]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: Icaro0310/devin-powerups/.github/workflows/release.yml@v1
    # Explicit mapping, not `inherit`: forwards only the Open VSX token
    # — inherit would hand every repo secret (GPG keys, PyPI token) to
    # the external reusable workflow.
    secrets:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    with:
      azure-marketplace-required: true
      package-dir: ${{ needs.resolve.outputs.dir }}
      pypi-environment: pypi
      vscode-ext-dir: ${{ needs.resolve.outputs.vsix-dir }}

  # Attach the published .vsix to the GitHub release — same convention as
  # release-qa-pack/release-devkit/release-bridge/release-memory. The
  # air-gapped corporate path installs by manual .vsix; without the asset
  # on the release that channel does not exist. The artifact the fanout
  # produced is the same bytes that went to Open VSX / Marketplace.
  attach-vsix:
    needs: [resolve, release, fanout]
    # needs.release.result is a status check, so the implicit success()
    # no longer applies to fanout — a failed registry leg (e.g. the
    # AZURE_MARKETPLACE_REQUIRED gate) must not strand the .vsix asset
    # when the GitHub release itself minted fine. A genuine packaging
    # failure still surfaces: download-artifact fails loudly when the
    # fanout never produced the vsix artifact.
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag'
      && needs.resolve.outputs.vsix-dir != ''
      && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: vsix
      - name: Attach .vsix to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh resolves the repo from the git remote when GH_REPO is
          # unset — there is no checkout in this job, so name it.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" vsix/*.vsix --clobber
