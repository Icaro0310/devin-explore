name: publish

# Publishes the package matching the pushed tag (or the selected dispatch
# input) to PyPI via Trusted Publishing (OIDC). The upload job must live in
# this file: PyPI matches job_workflow_ref against this workflow's path.

on:
  push:
    tags: ['doctor-v*','graph-v*','history-v*','pm-v*','search-v*']
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - doctor
          - graph
          - history
          - pm
          - search

permissions:
  contents: read

jobs:
  # Wheel __version__ gate lives in one place — verified before publish runs.
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {dir: packages/doctor, mod: devin_doctor}
          - {dir: packages/graph, mod: devin_graph}
          - {dir: packages/history, mod: devin_history}
          - {dir: packages/pm, mod: devin_pm}
          - {dir: packages/search, mod: devin_search}
    uses: Icaro0310/devin-powerups/.github/workflows/verify-wheel-version.yml@v1
    with:
      package-dir: ${{ matrix.dir }}
      module: ${{ matrix.mod }}
      python-version: "3.12"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve package directory
        id: pkg
        env:
          REF: ${{ github.ref_name }}
          SEL: ${{ inputs.package }}
        run: |
          base="${SEL:-${REF%%-v*}}"
          case "$base" in
              doctor) echo "dir=packages/doctor" >> "$GITHUB_OUTPUT" ;;
              graph) echo "dir=packages/graph" >> "$GITHUB_OUTPUT" ;;
              history) echo "dir=packages/history" >> "$GITHUB_OUTPUT" ;;
              pm) echo "dir=packages/pm" >> "$GITHUB_OUTPUT" ;;
              search) echo "dir=packages/search" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown package: $base" >&2; exit 1 ;;
          esac
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      # Supply-chain guard: wheels once reached PyPI via dispatch from
      # unmerged branches elsewhere in the ecosystem. Refuse to upload
      # when the publish origin is not merged.
      - name: Require publish origin merged into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/compare/main...${GITHUB_SHA}" --jq .status)
          case "$status" in
            behind|identical) ;;
            *) echo "::error::publish origin is '$status' vs main — refusing to publish an unmerged commit"; exit 1 ;;
          esac
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: ${{ steps.pkg.outputs.dir }}/dist
          skip-existing: true
