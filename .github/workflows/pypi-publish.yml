name: publish

# Publishes the package matching the pushed tag (or the selected dispatch
# input) to PyPI via Trusted Publishing (OIDC). The upload job must live in
# this file: PyPI matches job_workflow_ref against this workflow's path.

on:
  push:
    tags: ['doctor-v*','graph-v*','history-v*','pm-v*','search-v*']
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - doctor
          - graph
          - history
          - pm
          - search

permissions:
  contents: read

jobs:
  # The tag (or dispatch input) names exactly one package. Resolve it once
  # and verify only that package — a matrix over all five would let an
  # unrelated package's version mismatch block this release.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.pkg.outputs.dir }}
      mod: ${{ steps.pkg.outputs.mod }}
    steps:
      - name: Resolve package directory and module
        id: pkg
        env:
          REF: ${{ github.ref_name }}
          SEL: ${{ inputs.package }}
        run: |
          base="${SEL:-${REF%%-v*}}"
          case "$base" in
              doctor)  echo "dir=packages/doctor"  >> "$GITHUB_OUTPUT"; echo "mod=devin_doctor"  >> "$GITHUB_OUTPUT" ;;
              graph)   echo "dir=packages/graph"   >> "$GITHUB_OUTPUT"; echo "mod=devin_graph"   >> "$GITHUB_OUTPUT" ;;
              history) echo "dir=packages/history" >> "$GITHUB_OUTPUT"; echo "mod=devin_history" >> "$GITHUB_OUTPUT" ;;
              pm)      echo "dir=packages/pm"      >> "$GITHUB_OUTPUT"; echo "mod=devin_pm"      >> "$GITHUB_OUTPUT" ;;
              search)  echo "dir=packages/search"  >> "$GITHUB_OUTPUT"; echo "mod=devin_search"  >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown package: $base" >&2; exit 1 ;;
          esac

  # Wheel __version__ gate lives in one place — verified before publish
  # runs, on the resolved package only.
  verify:
    needs: resolve
    uses: Icaro0310/devin-powerups/.github/workflows/verify-wheel-version.yml@61bf0b6bf9d726a8b7b5217556e0f6ed432fbc62 # v1
    with:
      package-dir: ${{ needs.resolve.outputs.dir }}
      module: ${{ needs.resolve.outputs.mod }}
      python-version: "3.12"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      # Ship the exact dist/ that passed the verify gate — rebuilding here
      # would upload an unchecked wheel.
      - name: Download verified dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      # Supply-chain guard: wheels once reached PyPI via dispatch from
      # unmerged branches elsewhere in the ecosystem. Refuse to upload
      # when the publish origin is not merged.
      - name: Require publish origin merged into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/compare/main...${GITHUB_SHA}" --jq .status)
          case "$status" in
            behind|identical) ;;
            *) echo "::error::publish origin is '$status' vs main — refusing to publish an unmerged commit"; exit 1 ;;
          esac
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
          skip-existing: true
