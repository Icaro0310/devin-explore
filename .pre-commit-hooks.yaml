- id: devin-doctor-gate
  name: devin-doctor environment check
  description: >-
    Health-gate the local Devin installation before committing:
    `devin-doctor check` runs every registered check — stores,
    schema versions, data health, config sanity (the repo's own
    `.devin/` is read via the project cwd), disk usage and update
    state — and exits 1 when any check FAILs, blocking the commit.
    WARN findings print but do not block. Read-only by design and
    fully offline: the tool's only network access lives behind
    `capabilities --probe-network`, which this hook never calls.
    Note: on a large data dir the disk-usage walk can take a
    while — that latency is the check itself, not a hang.
  entry: devin-doctor check
  language: system
  pass_filenames: false
  always_run: true
